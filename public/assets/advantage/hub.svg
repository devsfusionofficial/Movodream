<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="hubCore" x1="72" y1="66" x2="128" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9A0DE" />
      <stop offset="1" stop-color="#C031B0" />
    </linearGradient>
    <linearGradient id="hubSlab" x1="45" y1="140" x2="155" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EADCFB" />
      <stop offset="1" stop-color="#C3A8F0" />
    </linearGradient>
    <radialGradient id="hubGlow" cx="0" cy="0" r="1" gradientTransform="translate(100 96) scale(76 62)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F03984" stop-opacity="0.26" />
      <stop offset="1" stop-color="#F03984" stop-opacity="0" />
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="96" rx="76" ry="62" fill="url(#hubGlow)" />

  <!-- orbit path -->
  <circle cx="100" cy="94" r="62" stroke="#E0A9EE" stroke-width="2" stroke-dasharray="5 7" fill="none" />

  <!-- satellites -->
  <g>
    <rect x="84" y="16" width="32" height="32" rx="10" fill="#FFFFFF" stroke="#F0C9EA" stroke-width="1.5" />
    <path d="M100 26l8 8-3 3-5-3-5 3-3-3z" fill="#F03984" />

    <rect x="146" y="52" width="32" height="32" rx="10" fill="#FFFFFF" stroke="#F0C9EA" stroke-width="1.5" />
    <rect x="155" y="62" width="14" height="12" rx="3" fill="#8B5CF6" />

    <rect x="146" y="106" width="32" height="32" rx="10" fill="#FFFFFF" stroke="#F0C9EA" stroke-width="1.5" />
    <circle cx="162" cy="120" r="7" fill="#F03984" />

    <rect x="84" y="140" width="32" height="32" rx="10" fill="#FFFFFF" stroke="#F0C9EA" stroke-width="1.5" />
    <rect x="92" y="150" width="16" height="11" rx="3" fill="#5A2DD7" />

    <rect x="22" y="106" width="32" height="32" rx="10" fill="#FFFFFF" stroke="#F0C9EA" stroke-width="1.5" />
    <path d="M31 122h16M39 114v16" stroke="#C031B0" stroke-width="3.4" stroke-linecap="round" />

    <rect x="22" y="52" width="32" height="32" rx="10" fill="#FFFFFF" stroke="#F0C9EA" stroke-width="1.5" />
    <circle cx="38" cy="65" r="4.5" fill="#8B5CF6" />
    <path d="M30 76c1-5 4-7 8-7s7 2 8 7z" fill="#8B5CF6" />
  </g>

  <!-- central hub -->
  <rect x="70" y="64" width="60" height="60" rx="18" fill="url(#hubCore)" />
  <path d="M85 108V82l15 14 15-14v26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- pedestal -->
  <path d="M100 140 L158 166 L100 192 L42 166 Z" fill="url(#hubSlab)" opacity="0.9" />
</svg>
