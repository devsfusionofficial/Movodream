<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="globeBody" x1="52" y1="24" x2="150" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="globeLand" x1="60" y1="40" x2="140" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9A0DE" />
      <stop offset="1" stop-color="#F03984" />
    </linearGradient>
    <linearGradient id="globeSlab" x1="45" y1="140" x2="155" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EADCFB" />
      <stop offset="1" stop-color="#C3A8F0" />
