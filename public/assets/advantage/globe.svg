    <radialGradient id="globeGlow" cx="0" cy="0" r="1" gradientTransform="translate(100 130) scale(68 28)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.42" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
