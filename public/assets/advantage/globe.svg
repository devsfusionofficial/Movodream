  <circle cx="100" cy="74" r="48" fill="url(#globeBody)" />
  <g clip-path="url(#globeClip)">
    <path d="M62 58c14-7 24 2 34-2s16-12 28-8 20 14 14 24-22 6-30 16-6 22-20 24-26-8-28-22 2-25 2-32z" fill="url(#globeLand)" opacity="0.9" />
    <g stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.8" fill="none">
      <ellipse cx="100" cy="74" rx="48" ry="20" />
      <ellipse cx="100" cy="74" rx="48" ry="38" />
      <ellipse cx="100" cy="74" rx="20" ry="48" />
      <path d="M100 26v96" />
