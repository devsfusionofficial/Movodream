  <path d="M100 118 L166 148 L100 178 L34 148 Z" fill="url(#globeSlab)" />
  <path d="M34 148 L100 178 L100 188 L34 158 Z" fill="#B294E8" opacity="0.55" />
  <path d="M166 148 L100 178 L100 188 L166 158 Z" fill="#9E7BDD" opacity="0.55" />

