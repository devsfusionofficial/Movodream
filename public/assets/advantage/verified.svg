<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="pinBody" x1="60" y1="24" x2="140" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9A0DE" />
      <stop offset="1" stop-color="#C031B0" />
    </linearGradient>
    <linearGradient id="pinCore" x1="78" y1="52" x2="122" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C4BE0" />
      <stop offset="1" stop-color="#5A2DD7" />
