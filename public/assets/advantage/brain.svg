<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="brainBody" x1="40" y1="30" x2="160" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9A0DE" />
      <stop offset="1" stop-color="#C031B0" />
    </linearGradient>
    <linearGradient id="brainSlab" x1="45" y1="140" x2="155" y2="180" gradientUnits="userSpaceOnUse">
