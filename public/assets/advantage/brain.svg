  <path d="M100 34c-13 0-22 7-25 17-11 1-19 9-19 20 0 6 2 11 6 15-3 4-4 8-4 13 0 13 11 22 25 22h17V34z" fill="url(#brainBody)" />
  <path d="M100 34c13 0 22 7 25 17 11 1 19 9 19 20 0 6-2 11-6 15 3 4 4 8 4 13 0 13-11 22-25 22h-17V34z" fill="url(#brainBody)" opacity="0.82" />

